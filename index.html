<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VLA 과외 — 내 성장</title>
<!-- PWA / iOS 홈화면 앱 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VLA 과외">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2230; --line:#2a3240;
    --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --gold:#ffd33d;
    --fire:#ff7b43; --green:#3fb950; --purple:#bc8cff; --red:#f85149;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%,#1b2540 0%,var(--bg) 60%);
       color:var(--txt); font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
       padding:20px; max-width:520px; margin:0 auto; -webkit-font-smoothing:antialiased}
  h1{font-size:19px; font-weight:800; letter-spacing:-.3px; margin-bottom:2px}
  .sub{color:var(--dim); font-size:12px; margin-bottom:18px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:18px; margin-bottom:14px; box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .row{display:flex; align-items:center; gap:16px}
  /* 레벨 링 */
  .ring{--p:0; width:92px; height:92px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
        background:conic-gradient(var(--acc) calc(var(--p)*1%), #222b3a 0);
        transition:--p 1s ease}
  .ring .inner{width:76px; height:76px; border-radius:50%; background:var(--card);
        display:grid; place-items:center; text-align:center}
  .ring .lvl{font-size:11px; color:var(--dim)} .ring .num{font-size:26px; font-weight:800; line-height:1}
  .rank{font-size:20px; font-weight:800} .rank .em{font-size:24px}
  .xptext{color:var(--dim); font-size:12px; margin-top:3px}
  /* 불꽃 스트릭 */
  .flame{font-size:52px; filter:drop-shadow(0 0 14px var(--fire));
         animation:flick 1.6s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}
  .bignum{font-size:40px; font-weight:900; line-height:1}
  .label{color:var(--dim); font-size:12px}
  /* 칭찬 배너 */
  .banner{background:linear-gradient(135deg,#2b2140,#3a2a1a); border:1px solid #4a3a5a;
          text-align:center; padding:16px}
  .banner .big{font-size:18px; font-weight:800; color:var(--gold)}
  .banner .small{color:var(--dim); font-size:12px; margin-top:4px}
  /* 퍼즐판 */
  .sec-title{font-size:13px; font-weight:700; color:var(--dim); margin-bottom:12px; text-transform:none}
  .puz{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:220px; margin:0 auto}
  .pz{aspect-ratio:1; border-radius:12px; display:grid; place-items:center; font-size:30px;
      background:#11161f; border:1px dashed #2a3240; color:#30384a; transition:.3s}
  .pz.on{background:linear-gradient(135deg,#1e2a44,#263455); border:1px solid var(--acc);
         color:#fff; box-shadow:0 0 12px rgba(88,166,255,.4); animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .puz-meta{text-align:center; margin-top:12px; font-size:13px}
  .shelf{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .trophy{background:#1a2030; border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px}
  /* 배지 */
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .bg{text-align:center; padding:12px 4px; border-radius:14px; background:#11161f; border:1px solid var(--line)}
  .bg.earned{background:linear-gradient(135deg,#2a2440,#3a2f1a); border-color:#5a4a2a;
             box-shadow:0 0 12px rgba(255,211,61,.25)}
  .bg .em{font-size:28px; filter:grayscale(1) opacity(.35)}
  .bg.earned .em{filter:none}
  .bg .nm{font-size:10px; color:var(--dim); margin-top:4px; line-height:1.2}
  .bg .dd{font-size:9px; color:#5a6678; margin-top:2px}
  .bg.earned .dd{color:var(--gold)}
  /* 칩 */
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{background:#2a1f1f; border:1px solid #5a3a3a; color:#ffb4a4; border-radius:999px;
        padding:4px 10px; font-size:11px}
  .chip.mild{background:#1f2a1f; border-color:#3a5a3a; color:#a4ffb4}
  /* 예산바 */
  .bar{height:8px; border-radius:999px; background:#222b3a; overflow:hidden; margin-top:8px}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--acc))}
  .foot{text-align:center; color:#4a5568; font-size:11px; margin-top:6px}
  canvas#cf{position:fixed; inset:0; pointer-events:none; z-index:50}
</style>
</head>
<body>
  <canvas id="cf"></canvas>
  <h1>🎮 VLA 연구자 — 내 성장</h1>
  <div class="sub" id="sub"></div>

  <div class="card" id="banner"></div>

  <div class="card">
    <div class="row">
      <div class="ring" id="ring"><div class="inner">
        <div class="lvl">LEVEL</div><div class="num" id="lvl">1</div></div></div>
      <div style="flex:1">
        <div class="rank"><span class="em" id="rankEm">🥚</span> <span id="rankTitle">VLA 뉴비</span></div>
        <div class="xptext" id="xptext"></div>
      </div>
      <div style="text-align:center">
        <div class="flame">🔥</div>
        <div class="bignum" id="streak">0</div>
        <div class="label">일 연속</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">🧩 퍼즐 수집 — <span id="puzName"></span></div>
    <div class="puz" id="puz"></div>
    <div class="puz-meta" id="puzMeta"></div>
    <div class="shelf" id="shelf"></div>
  </div>

  <div class="card">
    <div class="sec-title">🏅 배지 진열장</div>
    <div class="badges" id="badges"></div>
  </div>

  <div class="card" id="weakCard" style="display:none">
    <div class="sec-title">🎯 복습이 필요한 개념</div>
    <div class="chips" id="weak"></div>
  </div>

  <div class="card">
    <div class="sec-title">💰 API 예산</div>
    <div id="costText" style="font-size:13px"></div>
    <div class="bar"><i id="costBar"></i></div>
  </div>

  <div class="foot" id="foot"></div>

<script>
const DATA = {"level": 1, "rank_emoji": "🥚", "rank_title": "VLA 뉴비", "xp": 11, "xp_cur_thr": 0, "xp_next_thr": 60, "streak": 1, "total_sessions": 1, "badges": [{"days": 3, "emoji": "🔥", "name": "작은 불씨", "earned": false}, {"days": 7, "emoji": "⚡", "name": "일주일 전사", "earned": false}, {"days": 14, "emoji": "💎", "name": "2주 정복자", "earned": false}, {"days": 30, "emoji": "🌟", "name": "한 달 마스터", "earned": false}, {"days": 50, "emoji": "🚀", "name": "50일 로켓", "earned": false}, {"days": 100, "emoji": "👑", "name": "백일의 전설", "earned": false}, {"days": 200, "emoji": "🛸", "name": "200일 개척자", "earned": false}, {"days": 365, "emoji": "🎓", "name": "1년 연구자", "earned": false}], "puzzle": {"pieces_total": 0, "per_puzzle": 9, "completed_puzzles": 0, "current_filled": 0, "cur_emoji": "🤖", "cur_name": "로봇 팔", "collection": []}, "weaknesses": [["temporal-ensembling-weighting-mechanism", 1]], "cost": 0.09873900000000001, "budget": 5.0, "today_done": true, "module_name": "Action Chunking & Temporal Ensembling", "day": 2, "day_theme": "구조 & 텐서 퀴즈", "generated_at": "2026-10-05", "celebrate": []};

function el(id){return document.getElementById(id)}

function render(){
  const d = DATA;
  el('sub').textContent = `${d.today_done ? '오늘 완료 ✓' : '오늘 아직 — 터미널에 tutor!'} · 총 ${d.total_sessions}세션`;

  // 칭찬 배너
  let bannerHtml = '';
  if (d.celebrate && d.celebrate.length){
    bannerHtml = `<div class="banner" style="border:0;padding:0">` +
      d.celebrate.map(c=>`<div class="big">${c}</div>`).join('') +
      `<div class="small">계속 이 기세로! 🚀</div></div>`;
  } else if (d.streak > 0){
    bannerHtml = `<div class="banner" style="border:0;padding:0">
      <div class="big">🔥 ${d.streak}일 연속 수강 중!</div>
      <div class="small">${d.today_done ? '오늘도 해냈어요. 대단합니다!' : '오늘 마저 하면 '+(d.streak+1)+'일! 불씨를 지켜요'}</div></div>`;
  } else {
    bannerHtml = `<div class="banner" style="border:0;padding:0">
      <div class="big">새로운 시작 ✨</div>
      <div class="small">오늘 첫 세션으로 불씨를 지펴봐요</div></div>`;
  }
  el('banner').innerHTML = bannerHtml;
  el('banner').classList.add('banner');

  // 레벨 링
  const span = (d.xp_next_thr||d.xp) - d.xp_cur_thr;
  const prog = d.xp_next_thr ? Math.max(0,Math.min(100, (d.xp-d.xp_cur_thr)/span*100)) : 100;
  const ring = el('ring'); ring.style.setProperty('--p', prog);
  el('lvl').textContent = d.level;
  el('rankEm').textContent = d.rank_emoji;
  el('rankTitle').textContent = d.rank_title;
  el('xptext').textContent = d.xp_next_thr
      ? `${d.xp} XP · 다음 레벨까지 ${d.xp_next_thr - d.xp} XP`
      : `${d.xp} XP · 최고 레벨 달성!`;
  el('streak').textContent = d.streak;

  // 퍼즐판
  const p = d.puzzle;
  el('puzName').textContent = `${p.cur_emoji} ${p.cur_name} (${p.current_filled}/${p.per_puzzle})`;
  const board = el('puz'); board.innerHTML = '';
  for(let i=0;i<p.per_puzzle;i++){
    const on = i < p.current_filled;
    board.innerHTML += `<div class="pz ${on?'on':''}">${on?p.cur_emoji:'?'}</div>`;
  }
  el('puzMeta').innerHTML = p.completed_puzzles>0
      ? `완성한 그림 <b>${p.completed_puzzles}</b>개 · 조각 총 <b>${p.pieces_total}</b>개`
      : `하루 공부 = 조각 1개 · ${p.per_puzzle}개 모으면 그림 완성!`;
  const shelf = el('shelf'); shelf.innerHTML = '';
  (p.collection||[]).forEach(c=> shelf.innerHTML += `<div class="trophy">${c}</div>`);

  // 배지
  const bg = el('badges'); bg.innerHTML='';
  d.badges.forEach(b=>{
    bg.innerHTML += `<div class="bg ${b.earned?'earned':''}">
      <div class="em">${b.emoji}</div>
      <div class="nm">${b.name}</div>
      <div class="dd">${b.earned?'✓ '+b.days+'일':b.days+'일'}</div></div>`;
  });

  // 약점
  if(d.weaknesses && d.weaknesses.length){
    el('weakCard').style.display='';
    el('weak').innerHTML = d.weaknesses.map(w=>`<span class="chip">${w[0]} ×${w[1]}</span>`).join('');
  }

  // 예산
  const pct = Math.min(100, d.cost/d.budget*100);
  el('costText').textContent = `누적 $${d.cost.toFixed(2)} / $${d.budget.toFixed(2)} · 남은 예산 $${(d.budget-d.cost).toFixed(2)}`;
  el('costBar').style.width = pct+'%';
  el('foot').textContent = `업데이트: ${d.generated_at}`;

  if(d.celebrate && d.celebrate.length) confetti();
}

// 서비스워커 등록 (https에서만 — 오프라인 지원)
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// 간단 컨페티
function confetti(){
  const c = el('cf'), x = c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const cols=['#ffd33d','#58a6ff','#3fb950','#bc8cff','#ff7b43'];
  let ps=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,
      r:4+Math.random()*5,c:cols[~~(Math.random()*cols.length)],v:2+Math.random()*4,a:Math.random()*6}));
  let t=0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height); t++;
    ps.forEach(p=>{p.y+=p.v; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a);
      x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r); x.restore();});
    if(t<160) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}
render();
</script>
</body>
</html>
